[project]
name = "bing-rewards-bot"
version = "0.1.0"
description = "Script to farm MS Rewards points on desktop"
authors = [
    {name = "Carl Furtado",email = "user0332@duck.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "selenium (>=4.46.0,<5.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "pygame-ce (>=2.5.8,<3.0.0)",
    "ollama (>=0.6.2,<0.7.0)",
    "pillow (>=10.0.0)",
    "pygetwindow (>=0.0.9,<0.0.10); sys_platform == 'win32'",
    "keyboard (>=0.13.5,<0.14.0); sys_platform == 'win32'"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false